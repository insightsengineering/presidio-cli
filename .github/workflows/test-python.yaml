---
name: Test 🧪

on:
  push:
    tags:
      - "*"
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests 👟
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Run in all these versions of Python
        python-version: ["3.10"]

    steps:
      - name: Checkout repo 🛎
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2

      - name: Setup Python ${{ matrix.python-version }} 🐍
        uses: actions/setup-python@e9aba2c848f5ebd159c070c61ea2c4e2b122355e # v2
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pipenv'

      - name: Install pipenv 🗃
        run: pipx install pipenv

      - name: Install dependencies 🍇
        run: |
          pipenv run python --version
          pipenv install --deploy --dev

      - name: Run tests 🧪
        run: |
          pipenv run pytest --junit-xml=/tmp/junit.xml \
            --cache-clear --cov=presidio_cli tests/ | tee /tmp/coverage.txt

      - name: Post PR comment 💬
        uses: MishaKav/pytest-coverage-comment@45d7be6c0a6b6d3c3a5fc40345e8fb4a1c4aa800 # main
        with:
          pytest-coverage-path: /tmp/coverage.txt
          junitxml-path: /tmp/junit.xml

      - name: Check CLI execution 🎮
        run: |
          pipenv run python -m presidio_cli --help
          pipenv run presidio --help
